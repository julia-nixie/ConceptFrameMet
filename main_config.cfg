[args]
# Bert pre-trained model selected in the list [bert-base-cased, roberta-base, albert-base-v1 / albert-large-v1] (default = roberta-base)
bert_model = roberta-base

logging_dir = /workspace/MetaphorFrame/frame_finder/checkpoints
data_dir = /workspace/MetaphorFrame/data_all/
frame_model = /workspace/MetaphorFrame/frame_finder/checkpoints/mask_ff_combined
source_model = /workspace/MetaphorFrame/source_finder/checkpoints/mask_source_combined

# QA-style models for frame and source prediction (for ISOLATED predictions)
frame_qa_model = nixie1981/sem_frames
source_qa_model = nixie1981/frame-aware-source-predictor

# Masked models for frame and source prediction (for CONTEXT predictions)
frame_mask_model = /workspace/MetaphorFrame/frame_finder/checkpoints/mask_ff_combined
source_mask_model = /workspace/MetaphorFrame/source_finder/checkpoints/mask_source_combined

# The input data dir. Should contain the .tsv files (VUAall / VUAverb / MOH-X/CLS / TroFi/CLS / VUA_DeepMet)
spv_isolate = False
small_mean = True
frame_mean = False
frame_logits = False
shuffle_concepts_in_batch = False
do_shuffle_eval = False

# Choose one of the settings
spvmask = False
spvmaskcls = False
# =====
# spvmask = True
# spvmaskcls = False

# add frame classificaiton loss or not
multitask = False

# The name of the task to train (vua(1-fold) / trofi(10-fold))
task_name = vua
# The name of model type (default = MELBERT) (BERT_BASE / BERT_SEQ / MELBERT_SPV / MELBERT_MIP / MELBERT)
model_type = FrameMelbert
# The hidden dimension for classifier (default = 768)
classifier_hidden = 768
# Learning rate scheduler (default = warmup_linear) (none / warmup_linear)
lr_schedule = warmup_linear
# Training epochs to perform linear learning rate warmup for. (default = 2)
warmup_epoch = 2
# Dropout ratio (default = 0.2)
drop_ratio = 0.2
# K-fold (default = 10)
kfold = 10
# Number of bagging (default = 0) (0 not for using bagging technique)
num_bagging = 0
# The index of bagging only for the case using bagging technique (default = 0)
bagging_index = 0

# Use additional linguistic features
# POS tag (default = True)
use_pos = True
# Local context (default = True)
use_local_context= True

# The maximum total input sequence length after WordPiece tokenization. (default = 200)
max_seq_length = 150
# Whether to run training (default = False)
do_train = True
# Whether to run eval on the test set (default = False)
do_test = True
# Whether to run eval on the dev set. (default = False)
do_eval = True
# Set this flag if you are using an uncased model. (default = False)
do_lower_case = False
# Weight of metaphor. (default = 3.0)
class_weight = 3
# Total batch size for training. (default = 32)
train_batch_size = 32
# Total batch size for eval. (default = 8)
eval_batch_size = 8
# The initial learning rate for Adam (default = 3e-5)
learning_rate = 3e-5
# Total number of training epochs to perform. (default = 3.0)
num_train_epoch = 10

# Whether not to use CUDA when available (default = False)
no_cuda = False
# random seed for initialization (default = 42)
seed = 42

# ===== AdaptiveSourceQAMelBert Configuration =====
# Source blending mode: 'additive' or 'replacement' (default = replacement)
# - additive: enhanced = target + alpha * source (keeps target strength)
# - replacement: blended = conf * source + (1-conf) * target (original soft confidence)
source_blend_mode = replacement

# Source usage mode: 'metaphor_only' or 'all' (default = all)
# - metaphor_only: Only use source for samples with high metaphor probability
# - all: Use source for all samples
source_use_mode = all

# Scaling factor for additive blending mode (default = 0.3)
# Only used when source_blend_mode = 'additive'
source_alpha = 0.3

# Metaphor probability threshold for metaphor-only mode (default = 0.5)
# Only used when source_use_mode = 'metaphor_only'
metaphor_threshold = 0.5

# Whether to unfreeze and fine-tune the source QA model (default = False)
unfreeze_source_qa = False

# Early stopping patience in epochs (default = 20)
early_stopping_patience = 20
